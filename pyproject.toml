[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factcheck"
version = "0.1.0"
description = "Evidence-grounded fact-checking CLI built with LangGraph, Gemini and Tavily (college project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    "google-genai>=1.30",
    "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Image-to-text (factcheck-ocr). RapidOCR bundles PP-OCRv6 small ONNX models: no download at run time.
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20", "pillow>=10", "numpy>=1.24"]
# Optional PaddleOCR engines. Install in a SEPARATE venv: paddlex pins opencv-contrib-python, which
# conflicts with rapidocr's opencv-python-headless. paddlepaddle 3.3.x crashes on CPU with oneDNN
# (Paddle issue #77340), hence the 3.2.2 pin.
ocr-paddle = ["paddleocr[doc-parser]>=3.7,<3.8", "paddlepaddle==3.2.2", "pillow>=10", "numpy>=1.24"]

[project.scripts]
factcheck = "factcheck.cli:main"
factcheck-ocr = "factcheck_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real Gemini/Tavily calls; skipped unless FACTCHECK_LIVE_TESTS=1 and keys are set",
    "ocr_live: runs a real OCR engine; skipped unless FACTCHECK_OCR_LIVE_TESTS=1",
]
